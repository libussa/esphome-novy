substitutions:
  name: novy-7831
  friendly_name: Novy Hood
  data_pin: GPIO4
  pairing_code: "1"
  # JSY-MK-194G TTL: JSY TX -> ESP RX, JSY RX -> ESP TX.
  jsy_rx_pin: GPIO16
  jsy_tx_pin: GPIO17

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0

# AZDelivery ESP32 NodeMCU Dev Kit C with CP2102 (ESP32-WROOM-32).
esp32:
  board: esp32dev
  flash_size: 4MB
  framework:
    type: esp-idf
    version: 5.5.5

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    # Encrypted OTA shares the native API key in ESPHome 2026.9.
    encryption:

logger:
  level: INFO
  hardware_uart: UART0

# Power waveform verified on this hood with the original remote's pairing code 1.
packages:
  power_replay: !include novy-power-waveform.yaml
  power_calibration: !include novy-power-calibration.yaml

external_components:
  - source:
      type: local
      path: ../components
    components: [novy]

# STX882 DATA -> GPIO4, VCC -> 3.3V, GND -> GND.
remote_transmitter:
  id: novy_rf
  pin: ${data_pin}
  carrier_duty_percent: 100%
  non_blocking: true
  eot_level: false

# JSY-MK-194G factory defaults: address 1, 4800 baud, 8N1. VCC -> 3.3V.
uart:
  id: jsy_uart
  rx_pin: ${jsy_rx_pin}
  tx_pin: ${jsy_tx_pin}
  baud_rate: 4800

novy:
  id: hood
  transmitter_id: novy_rf
  uart_id: jsy_uart
  # CT1 on the light conductor, CT2 on the motor's common conductor.
  light_channel: 1
  fan_channel: 2
  pairing_code: ${pairing_code}
  # The JSY refreshes every 330 ms; one read takes about 170 ms at 4800 baud.
  update_interval: 500ms
  averaging_window: 1s
  stale_timeout: 5s
  settle_time: 2s
  step_timeout: 15s
  # Fan ranges and light threshold come from the calibration package.
  fan:
    name: Novy Fan
  light:
    name: Novy Light
    restore_mode: ALWAYS_OFF
  raw_buttons:
    power:
      name: Novy Raw power
    light:
      name: Novy Raw light
    plus:
      name: Novy Raw speed up
    minus:
      name: Novy Raw speed down
    novy:
      name: Novy Raw Novy
  fan_power:
    name: Novy Fan power
  light_power:
    name: Novy Light power
  reading_age:
    name: Novy Reading age
  feedback_valid:
    name: Novy Feedback valid
  fan_feedback_valid:
    name: Novy Fan feedback valid
  light_feedback_valid:
    name: Novy Light feedback valid
  inferred_mode:
    name: Novy Inferred mode
  command_status:
    name: Novy Command status
