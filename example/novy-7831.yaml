substitutions:
  name: novy-7831
  friendly_name: Novy 7831
  board: esp32-c3-devkitm-1
  data_pin: GPIO4
  pairing_code: "1"
  jsy_rx_pin: GPIO5
  jsy_tx_pin: GPIO6

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0

esp32:
  board: ${board}
  framework:
    type: esp-idf
    version: 5.5.5

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: INFO

external_components:
  - source:
      type: local
      path: ../components
    components: [novy]

remote_transmitter:
  id: novy_rf
  pin: ${data_pin}
  carrier_duty_percent: 100%
  non_blocking: true
  eot_level: false

# JSY-MK-194G factory defaults: address 1, 4800 baud, 8N1.
uart:
  id: jsy_uart
  rx_pin: ${jsy_rx_pin}
  tx_pin: ${jsy_tx_pin}
  baud_rate: 4800

novy:
  id: hood
  transmitter_id: novy_rf
  uart_id: jsy_uart
  light_channel: 1
  fan_channel: 2
  pairing_code: ${pairing_code}
  update_interval: 500ms
  averaging_window: 3s
  stale_timeout: 30s
  settle_time: 3s
  step_timeout: 30s
  # Empty deliberately. Follow docs/commissioning.md before adding the five
  # fan ranges and light_threshold.
  fan_calibration: []
  fan:
    name: Fan
  light:
    name: Light
    restore_mode: ALWAYS_OFF
  raw_buttons:
    power:
      name: Raw power
    light:
      name: Raw light
    plus:
      name: Raw speed up
    minus:
      name: Raw speed down
    novy:
      name: Raw Novy
  fan_power:
    name: Fan power
  light_power:
    name: Light power
  reading_age:
    name: Reading age
  feedback_valid:
    name: Feedback valid
  inferred_mode:
    name: Inferred mode
  command_status:
    name: Command status
