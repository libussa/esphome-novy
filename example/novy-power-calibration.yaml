# PROVISIONAL ranges for this Novy 7831's JSY-MK-194G fan channel.
# Taken from the light-off rows of the whole-hood Shelly measurements of
# 2026-10-01 (commit 8885128), which included a 1 W margin. Motor-only
# readings may sit a few watts lower: states outside these ranges report
# unrecognized_power rather than a wrong speed. Re-measure on the JSY.
novy:
  fan_calibration:
    - speed: 0
      min_power: 0.0
      max_power: 1.0
    - speed: 1
      min_power: 77.0
      max_power: 86.7
    - speed: 2
      min_power: 139.8
      max_power: 149.6
    - speed: 3
      min_power: 205.7
      max_power: 211.5
    - speed: 4
      min_power: 227.0
      max_power: 231.7
  # About half the ~7 W the light added to the Shelly readings.
  light_threshold: 3.0
